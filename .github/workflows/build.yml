name: build-test
on:
  pull_request:
  push:
    branches:
      - edge
      - stable

jobs:
  snap:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - uses: snapcore/action-build@v1
      id: snapcraft
    - uses: actions/upload-artifact@v7
      with:
        name: 'snap'
        path: ${{ steps.snapcraft.outputs.snap}}
